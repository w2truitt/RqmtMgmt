apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rqmtmgmt-ingress
  namespace: rqmtmgmt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/redirect-scheme: "https"
spec:
  ingressClassName: "traefik"
  tls:
  - hosts:
    - rqmtmgmt.local
    secretName: rqmtmgmt-tls
  rules:
  - host: rqmtmgmt.local
    http:
      paths:
      # API routes - backend service
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      # Swagger documentation - backend service
      - path: /swagger
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      # Health checks - backend service
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
      # IdentityServer endpoints
      - path: /.well-known
        pathType: Prefix
        backend:
          service:
            name: identityserver-service
            port:
              number: 80
      - path: /connect
        pathType: Prefix
        backend:
          service:
            name: identityserver-service
            port:
              number: 80
      # IdentityServer Account pages (login, logout, etc.)
      - path: /Account
        pathType: Prefix
        backend:
          service:
            name: identityserver-service
            port:
              number: 80
      # Frontend - catch all other routes
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
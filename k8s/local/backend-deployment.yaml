apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: rqmtmgmt
  labels:
    app: backend
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        component: api
    spec:
      containers:
      - name: backend
        image: localhost:5000/rqmtmgmt-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: ConnectionStrings__DefaultConnection
        - name: Authentication__Authority
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: Authentication__Authority
        - name: Authentication__Audience
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: Authentication__Audience
        - name: Authentication__RequireHttpsMetadata
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: Authentication__RequireHttpsMetadata
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          readOnlyRootFilesystem: false  # Set to true after ensuring temp directories work
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL